<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Analyzer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f7f7fb;
      color: #1f2937;
    }
    .container {
      max-width: 720px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 24px;
    }
    h1 { margin-top: 0; }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 20px;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #status { margin-bottom: 16px; color: #b91c1c; }
    .card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
      background: #fafafa;
    }
    .label {
      color: #4b5563;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    .value {
      font-size: 1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>GUI PDF Analyzer</h1>
    <p>Select a PDF file to inspect basic structure and metadata.</p>

    <div class="controls">
      <input id="pdfInput" type="file" accept="application/pdf,.pdf" />
      <button id="analyzeBtn">Analyze PDF</button>
    </div>

    <div id="status" aria-live="polite"></div>
    <section id="results"></section>
  </main>

  <script src="./analyzer.js"></script>
  <script>
    const input = document.getElementById('pdfInput');
    const status = document.getElementById('status');
    const results = document.getElementById('results');

    function renderCard(label, value) {
      const wrapper = document.createElement('article');
      wrapper.className = 'card';
      const labelNode = document.createElement('div');
      labelNode.className = 'label';
      labelNode.textContent = label;

      const valueNode = document.createElement('div');
      valueNode.className = 'value';
      valueNode.textContent = String(value);

      wrapper.appendChild(labelNode);
      wrapper.appendChild(valueNode);
      return wrapper;
    }

    function renderResults(data) {
      results.innerHTML = '';
      results.appendChild(renderCard('File Name', data.fileName));
      results.appendChild(renderCard('Size (bytes)', data.fileSizeBytes));
      results.appendChild(renderCard('PDF Version', data.pdfVersion));
      results.appendChild(renderCard('Page Count', data.pageCount));
      results.appendChild(renderCard('Object Count', data.objectCount));
      results.appendChild(renderCard('Stream Count', data.streamCount));
      results.appendChild(renderCard('Encrypted', data.isEncrypted ? 'Yes' : 'No'));
      results.appendChild(renderCard('Title', data.metadata.title));
      results.appendChild(renderCard('Author', data.metadata.author));
      results.appendChild(renderCard('Creator', data.metadata.creator));
      results.appendChild(renderCard('Producer', data.metadata.producer));
    }

    document.getElementById('analyzeBtn').addEventListener('click', async () => {
      status.textContent = '';
      results.innerHTML = '';

      const file = input.files[0];
      if (!file) {
        status.textContent = 'Please select a PDF file first.';
        return;
      }

      try {
        const arrayBuffer = await file.arrayBuffer();
        const analyzed = window.PdfAnalyzer.analyzePdfBytes(new Uint8Array(arrayBuffer), file.name);
        renderResults(analyzed);
      } catch (error) {
        status.textContent = error.message || 'Unable to analyze selected PDF.';
      }
    });
  </script>
</body>
</html>
